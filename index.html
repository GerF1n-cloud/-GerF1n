<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <title>Переклади GerF1n</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0f0f0f;
      color: #eee;
      margin: 0;
      padding: 20px;
    }

    h1 {
      text-align: center;
      margin-bottom: 30px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 20px;
    }

    .card {
      background: #1a1a1a;
      border-radius: 15px;
      overflow: hidden;
      cursor: pointer;
      transition: 0.2s;
      padding: 10px;
      min-height: 350px;
      display: flex;
      flex-direction: column;
    }

    .card:hover {
      transform: scale(1.03);
    }

    .card img {
      width: 100%;
      height: 160px;
      object-fit: cover;
      border-radius: 10px;
    }

    .card-content {
      padding: 10px 0;
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .card h2 {
      font-size: 22px;
      margin: 0 0 5px 0;
    }

    .card p {
      font-size: 16px;
      flex-grow: 1;
    }

    .tags {
      margin-top: 10px;
    }

    .tag {
      display: inline-block;
      background: #333;
      padding: 4px 8px;
      border-radius: 8px;
      font-size: 12px;
      margin-right: 5px;
      margin-bottom: 5px;
    }

    .read-btn {
      display: block;
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      font-size: 16px;
      background: #333;
      color: #eee;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: 0.2s;
    }

    .read-btn:hover {
      background: #555;
    }

    /* Адаптивність для мобільних */
    @media screen and (max-width: 700px) {
      .grid {
        grid-template-columns: 1fr;
      }

      .card img {
        height: 200px;
      }
    }
  </style>
</head>
<body>

<h1>Переклади GerF1n</h1>

<div class="grid" id="content"></div>

<script src="script.js"></script>
</body>
</html>
