<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <title>Розділи</title>

  <style>
    body {
      font-family: Arial;
      background: #0f0f0f;
      color: #eee;
      max-width: 1000px;
      margin: auto;
      padding: 20px;
    }

    h1 {
      text-align: center;
      margin-bottom: 20px;
    }

    /* Кнопка Назад */
    #back-btn {
      background: #333;
      color: #eee;
      border: none;
      border-radius: 10px;
      padding: 10px 15px;
      font-size: 16px;
      cursor: pointer;
      margin-bottom: 20px;
      transition: 0.2s;
    }

    #back-btn:hover { background: #555; }

    /* Контейнер картинка + текст */
    .content-wrapper {
      display: flex;
      gap: 20px;
      margin-bottom: 30px;
      align-items: flex-start;
    }

    .content-wrapper img {
      width: 300px;
      height: auto;
      border-radius: 10px;
      flex-shrink: 0;
    }

    .text-tags {
      flex-grow: 1;
      display: flex;
      flex-direction: column;
    }

    .text-tags p {
      font-size: 16px;
      line-height: 1.5;
    }

    .tags { margin-top: 10px; }
    .tag {
      background: #333;
      padding: 5px 10px;
      border-radius: 10px;
      margin-right: 5px;
      margin-bottom: 5px;
      display: inline-block;
    }

    /* Розділи внизу */
    .sections {
      background: #1a1a1a;
      padding: 15px;
      border-radius: 10px;
    }

    .section {
      margin-bottom: 10px;
      padding: 10px;
      background: #222;
      border-radius: 8px;
      cursor: pointer;
      transition: 0.2s;
    }

    .section:hover { background: #333; }

    /* Адаптивність */
    @media screen and (max-width: 700px) {
      .content-wrapper { flex-direction: column; align-items: center; }
      .content-wrapper img { width: 80%; max-width: 400px; margin-bottom: 15px; }
      .text-tags { width: 100%; }
    }
  </style>
</head>
<body>

<h1 id="title"></h1>

<button id="back-btn">⬅ Назад</button>

<div class="content-wrapper">
  <img id="image">
  <div class="text-tags">
    <p id="description"></p>
    <div id="tags" class="tags"></div>
  </div>
</div>

<div class="sections" id="sections"></div>

<script src="post.js"></script>
</body>
</html>
