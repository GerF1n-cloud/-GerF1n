<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <title>Читання</title>

  <style>
    body {
      margin: 0;
      background: #0f0f0f;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    /* Верхня панель */
    .top-bar {
      position: sticky;
      top: 0;
      background: #111;
      padding: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 100;
    }

    button {
      background: #333;
      color: white;
      border: none;
      padding: 10px 15px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
    }

    button:hover {
      background: #555;
    }

    /* Контейнер для сторінок */
    .pages {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-top: 20px;
    }

    .pages img {
      width: 100%;
      max-width: 900px;
      height: auto; /* ключове! */
      display: block;
      margin: 10px 0;
      border-radius: 10px;
    }

    /* Адаптивність для мобільних */
    @media screen and (max-width: 700px) {
      .pages img {
        width: 95%;
        height: auto;
      }
    }
  </style>
</head>
<body>

<div class="top-bar">
  <button onclick="goBack()">⬅ Назад</button>
  <div id="chapter-title"></div>
  <button onclick="nextChapter()">➡ Далі</button>
</div>

<div class="pages" id="pages"></div>

<script src="chapter.js"></script>
</body>
</html>
